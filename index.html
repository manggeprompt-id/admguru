<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduPlan AI - RPP Generator (GAS Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #f3f4f6; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <!-- Struktur lengkap ada di versi sebelumnya -->
        <h1 class="text-2xl p-4">EduPlan AI (GAS Version)</h1>
        <p class="p-4">Silakan rujuk ke Code.gs dan panduan setup.</p>
    </div>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgKJUCyHxX7UVAIjv8IXk_umNfimEoTaQbsfLw3wCe7ecvrLvONN883sIIrXiVfxcz/exec"; 
        
        async function fetchGAS(payload) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });
                return await response.json();
            } catch (error) {
                console.error("Error calling GAS:", error);
                throw error;
            }
        }
        
        // Cek koneksi API key dan logic lainnya
    </script>
</body>
</html>
